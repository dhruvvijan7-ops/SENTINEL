services:
  db:
    image: postgres:18
    container_name: sentinel-db
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      # POSTGRES_PASSWORD removed for public repo
    ports:
      - "54321:5432"
    volumes:
      - sentinel-pgdata:/var/lib/postgresql
      - ./packaging/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sentinel-pgdata:
